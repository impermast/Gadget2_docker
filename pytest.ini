[pytest]
testpaths = tests
addopts = -q
markers =
    math: level 1 — unit tests of loaders math on synthetic fixtures (fast, analytic answers)
    golden: level 2 — answer testing against documented golden values (tests/golden/values.json)
    guard: layout enforcement — no ad-hoc plotting/outputs outside nbody/scripts/analysis (AST scan, fast)
    render: smoke-render — каждый plot реестра рисует на синтетической фикстуре (медленнее, ловит контрактные ошибки)