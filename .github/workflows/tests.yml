# Fast test suite: synthetic fixtures only, no simulations (~1 s total).
# Pipeline runs groups FROM SIMPLE TO COMPLEX — each stage starts only after
# the previous one succeeds (needs:). A failing stage skips everything after.
#   1. math   — level 1: loaders math on synthetic fixtures (analytic answers)
#   2. golden — level 2: answer testing against tests/golden/values.json
# To add a stage: register a marker in pytest.ini, add a job with
# needs: [previous stages], extend the chain below (e.g. render smoke later).
name: tests

on:
  push:
    branches: [master, agent/dev]
  pull_request:
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# outdated runs on the same branch are canceled automatically
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Stage 1: cheapest, most diagnostic tests ─────────────────────────────
  math:
    name: "1 · math — loaders unit tests"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install numpy h5py pytest

      - name: Run math tests
        run: python -m pytest tests/ -m math -v -ra --junitxml=test-results-math.xml

      - name: Publish test summary
        if: always()
        run: python .github/scripts/test_summary.py test-results-math.xml math

  # ─── Stage 2: documented reference values ─────────────────────────────────
  golden:
    name: "2 · golden — answer testing"
    needs: math                # runs only if stage 1 passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install numpy h5py pytest

      - name: Run golden tests
        run: python -m pytest tests/ -m golden -v -ra --junitxml=test-results-golden.xml

      - name: Publish test summary
        if: always()
        run: python .github/scripts/test_summary.py test-results-golden.xml golden
